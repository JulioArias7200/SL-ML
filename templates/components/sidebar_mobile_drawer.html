<!-- OFF-CANVAS SIDEBAR DRAWER (Móvil & Tableta < 1024px) -->
<div id="mobile-drawer-backdrop" 
     class="drawer-backdrop fixed inset-0 z-50 bg-black/60 backdrop-blur-sm lg:hidden flex">
    
    <div id="mobile-drawer-panel" 
         class="drawer-panel w-72 max-w-[85vw] h-full bg-surface-container-low border-r border-outline-variant/50 p-5 flex flex-col justify-between shadow-2xl relative">
        
        <div class="flex flex-col gap-6">
            <!-- Header del Drawer con botón de cierre -->
            <div class="flex items-center justify-between pb-3 border-b border-outline-variant/30">
                <div class="flex items-center gap-2.5">
                    <div class="size-9 rounded border border-primary-container/40 bg-surface-container-high flex items-center justify-center text-primary-container shadow-sm">
                        <span class="material-symbols-outlined text-xl">shield</span>
                    </div>
                    <div>
                        <h2 class="text-on-surface text-sm font-bold tracking-tight">CPD ANALYTICS</h2>
                        <span class="text-outline text-[10px] font-data-code">CHICAGO ML-OPS</span>
                    </div>
                </div>

                <!-- Botón de cerrar drawer -->
                <button type="button" 
                        id="btn-mobile-drawer-close"
                        class="size-8 rounded-lg bg-surface-container-high hover:bg-surface-container-highest text-on-surface-variant flex items-center justify-center"
                        title="Cerrar Menú">
                    <span class="material-symbols-outlined text-xl">close</span>
                </button>
            </div>

            <!-- Navegación Móvil -->
            <nav class="flex flex-col gap-2 font-label-md">
                <a href="{{ url_for('dashboard_bp.index') }}" 
                   class="flex items-center gap-3 px-3.5 py-3 rounded-lg text-sm font-semibold transition-all {{ 'bg-surface-container-high border-l-4 border-primary-container text-primary-container' if active_page == 'dashboard' else 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container' }}">
                    <span class="material-symbols-outlined text-xl">dashboard</span>
                    <span>Dashboard General</span>
                </a>

                <a href="{{ url_for('kmeans_nlp_bp.view') }}" 
                   class="flex items-center gap-3 px-3.5 py-3 rounded-lg text-sm font-semibold transition-all {{ 'bg-surface-container-high border-l-4 border-primary-container text-primary-container' if active_page == 'kmeans-nlp' else 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container' }}">
                    <span class="material-symbols-outlined text-xl">memory</span>
                    <span>K-Means & NLP</span>
                </a>

                <a href="{{ url_for('spatial_density_bp.view') }}" 
                   class="flex items-center gap-3 px-3.5 py-3 rounded-lg text-sm font-semibold transition-all {{ 'bg-surface-container-high border-l-4 border-primary-container text-primary-container' if active_page == 'espacial-densidad' else 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container' }}">
                    <span class="material-symbols-outlined text-xl">explore</span>
                    <span>Geoespacial & Densidad</span>
                </a>
            </nav>
        </div>

        <!-- Telemetría & Modo Noche en Drawer Móvil -->
        <div class="flex flex-col gap-3 pt-4 border-t border-outline-variant/30 font-data-code">
            <div class="flex items-center justify-between">
                <span class="text-xs text-outline">Tema de Interfaz:</span>
                {% include 'components/theme_toggle.html' %}
            </div>
            
            <div class="p-2.5 rounded bg-surface-container border border-outline-variant/40 text-[11px] text-outline space-y-1">
                <div class="flex justify-between items-center text-on-surface">
                    <span class="font-bold text-primary-container">GPU ENGINE</span>
                    <span class="text-emerald-400 font-semibold text-[10px]">99.4% ONLINE</span>
                </div>
                <div class="flex justify-between">
                    <span>VRAM:</span>
                    <span class="text-on-surface">6.7 / 16.0 GB (41.8%)</span>
                </div>
            </div>
        </div>

    </div>
</div>
