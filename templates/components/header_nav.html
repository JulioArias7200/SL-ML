<!-- HEADER GLOBAL DEL SISTEMA (FIJO & STICKY - RESPONSIVO MÓVIL, TABLETA Y DESKTOP) -->
<header class="shrink-0 flex items-center justify-between border-b border-outline-variant/60 px-4 sm:px-6 lg:px-8 py-2.5 bg-surface/90 sticky top-0 z-30 backdrop-blur-xl shadow-sm">
    <div class="flex items-center gap-3 sm:gap-6">
        <!-- Botón Hamburguesa para Móvil y Tableta (<1024px) -->
        <button type="button" 
                id="btn-mobile-drawer-open"
                class="btn-tactile size-8.5 rounded-lg bg-surface-container border border-outline-variant text-on-surface hover:text-cyan-400 flex lg:hidden items-center justify-center shadow-sm cursor-pointer"
                title="Abrir Menú">
            <span class="material-symbols-outlined text-xl">menu</span>
        </button>

        <!-- Brand Táctico en Header -->
        <a href="{{ url_for('dashboard_bp.index') }}" class="flex items-center gap-2 group">
            <span class="size-2 rounded-full bg-cyan-600 dark:bg-cyan-400 animate-pulse glow-cyan"></span>
            <span class="font-headline-sm font-bold text-xs sm:text-sm text-slate-950 dark:text-white tracking-tight uppercase group-hover:text-cyan-700 dark:group-hover:text-cyan-400 transition-colors">
                CPD Urban Intelligence
            </span>
            <span class="hidden md:inline text-slate-600 dark:text-slate-400 text-[11px] font-data-code">
                // v4.8
            </span>
        </a>

        <!-- Selector de Contexto estilo Segmented Control (Apple / Emil Design) -->
        <div class="segmented-control font-data-code text-xs shadow-inner">
            <a href="{{ url_for(request.endpoint or 'dashboard_bp.index', ctx='bolivia') }}" 
               class="segmented-btn btn-tactile flex items-center gap-1.5 {{ 'active' if current_context != 'chicago' else '' }}"
               title="Eje Principal: Inteligencia de Noticias de Bolivia">
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-surface-container-high font-bold">BO</span>
                <span class="hidden sm:inline">Bolivia</span>
            </a>
            <a href="{{ url_for(request.endpoint or 'dashboard_bp.index', ctx='chicago') }}" 
               class="segmented-btn btn-tactile flex items-center gap-1.5 {{ 'active' if current_context == 'chicago' else '' }}"
               title="Benchmark Secundario: Chicago">
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-surface-container-high font-bold">US</span>
                <span class="hidden sm:inline">Chicago</span>
            </a>
        </div>
    </div>

    <!-- Acciones Derechas: Telemetría & Modo Noche / Día -->
    <div class="flex items-center gap-2 sm:gap-3">
        <!-- Status Pill de Telemetría -->
        <div class="hidden xl:flex items-center gap-2 px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-900/80 border border-emerald-500/40 font-data-code text-xs text-slate-700 dark:text-slate-300 backdrop-blur-md shadow-sm">
            <span class="size-2 rounded-full bg-emerald-600 dark:bg-emerald-400 animate-pulse"></span>
            <span class="text-emerald-700 dark:text-emerald-400 font-semibold">GPU T4: ONLINE</span>
        </div>

        <!-- Toggle Modo Día / Modo Noche -->
        {% include 'components/theme_toggle.html' %}
    </div>
</header>
