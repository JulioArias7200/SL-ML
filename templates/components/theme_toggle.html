<!-- Botón Conmutador de Tema (Modo Día / Modo Noche) -->
<button type="button" 
        data-theme-toggle 
        class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-surface-container border border-outline-variant/50 hover:border-primary-container text-on-surface hover:text-primary-container transition-all shadow-sm group"
        title="Cambiar Tema (Día / Noche)">
    <span class="material-symbols-outlined theme-icon text-lg text-primary-container group-hover:rotate-180 transition-transform duration-300">
        light_mode
    </span>
    <span class="theme-label text-xs font-data-code font-semibold hidden sm:inline">
        Modo Día
    </span>
</button>
