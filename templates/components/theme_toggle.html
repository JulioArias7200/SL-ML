<!-- Botón Conmutador de Tema (Modo Día / Modo Noche) -->
<button type="button" 
        data-theme-toggle 
        class="btn-tactile flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-surface-container border border-outline-variant hover:border-primary-container text-on-surface hover:text-primary-container shadow-sm cursor-pointer select-none"
        title="Cambiar Tema (Día / Noche)">
    <span class="material-symbols-outlined theme-icon text-base text-primary-container">
        light_mode
    </span>
    <span class="theme-label text-xs font-data-code font-semibold hidden md:inline">
        Modo Día
    </span>
</button>
